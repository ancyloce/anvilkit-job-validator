# anvilkit-validator Job configuration (reviewed, secret-free; baked into the
# image at /etc/anvilkit/anvilkit-validator/config.yaml, root-owned and
# unreadable by the candidate UID). Precedence is defaults < this file; the
# launch facts come only from the Job template's environment
# (ANVILKIT_LAUNCH_ID, ANVILKIT_ATTEMPT_ID, ANVILKIT_LAUNCH_ENVELOPE and the
# per-launch ANVILKIT_LAUNCH_SECRET of DEC-045, a Secret reference) and are
# refused inside this file.
paths:
  workspace: /workspace              # emptyDir; the chain works under /workspace/w
  verdict: /anvilkit/verdict         # emptyDir; chmod 0700 by this process before anything runs
  termination_log: /dev/termination-log
  fixed_source: /anvilkit/validator/fixtures/component/hero   # the reviewed fixed component (root 0700)
candidate:
  identity: setpriv                  # the build, SSR render and browser steps run as this identity through setpriv
  uid: 10001
  gid: 10001
harness:                             # the protected SSR harness judges the render under its own UID (never the candidate's or the sidecar's)
  uid: 10003
  gid: 10003
sidecar:
  uid: 10002
  socket: "@anvilkit/trusted"        # the sidecar's trusted socket: an abstract-namespace name inside the Pod (DEC-045; no shared volume); every request carries the launch secret's trusted token and every answer the sidecar's proof
  wait_ms: 60000
  request_timeout_ms: 60000
observer:
  identity: anvilkit-validator-supervisor
host_checks:                         # both mandatory under validator-dev-v1: the Job refuses a configuration that disables one
  ssr: true
  browser: true                      # Playwright's pinned Chromium headless shell is baked into the image (PLAYWRIGHT_BROWSERS_PATH)
source_revision: "1"                 # the fixed component's reviewed revision, used only when the launch names no allocated identity; a bound source is certified at the launch's component.sourceRevision
validator_profile: validator-dev-v1
