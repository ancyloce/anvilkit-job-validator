# This directory is its own pnpm workspace root (one package), independent of
# the parent's workspace globs, as contracts/ is: the lockfile here pins the
# trusted validator's toolchain (Rollup, TypeScript, the host's React/Puck,
# Playwright) that profiles/ records. Candidate dependencies are never
# installed from a candidate lockfile; the build resolves only what the
# build-support profile allows, from this locked install.
packages: []
# No lifecycle script runs in this install (DD-04 §1: a lockfile does not
# establish lifecycle-script safety, and this is the trusted side). esbuild's
# postinstall only fetches a platform binary when its optional platform
# package is absent; the locked optional package is present, so it is denied.
allowBuilds:
  esbuild: false
minimumReleaseAgeExclude:
  - '@types/node@24.13.5'
# happy-dom 21.0.4 fixes GHSA-834v-8h66-3h79 / CVE-2026-115895 (HIGH: an
# unsanitized import alias leads to host code execution; affected >= 17.0.0,
# <= 21.0.3, no 20.x fix), found by the job-images publication scan on
# 2026-10-26. It arrives through @puckeditor/core 0.23.0 (declares ^20.0.10)
# and @tiptap/html (peer ^20.8.9); no stable Puck release moves past it yet.
# This image renders untrusted component code, so the override is not
# optional. Remove it once Puck and @tiptap/html allow a fixed release.
overrides:
  happy-dom: 21.0.4
peerDependencyRules:
  allowedVersions:
    happy-dom: '21'
